name: Cloudflare Deploy (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      branch:
        required: true
        type: string
      custom_domain_config:
        required: false
        type: boolean
      artifact_name:
        required: false
        type: string
        description: 'Name of pre-built artifact to download (skips build if provided)'
    secrets:
      CF_ACCOUNT_ID:
        required: true
      CF_ZONE_ID:
        required: true
      R2_API_TOKEN:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      ADMIN_PORTAL_PASSWORD:
        required: true
      ADMIN_SESSION_SECRET:
        required: true
      RESEND_API_KEY:
        required: true
      RESEND_WEBHOOK_SECRET:
        required: false
      CONTACT_EMAIL:
        required: true
      CLOUDFLARE_ANALYTICS_TOKEN:
        required: false

jobs:
  prepare:
    name: Configure Cloudflare resources
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_HOSTNAME: ${{ vars.R2_PUBLIC_HOSTNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'

      - name: Install runtime dependencies
        run: npm install --legacy-peer-deps --silent --omit=dev

      - name: Sync R2 CORS policy
        run: node scripts/configure-r2-cors.js

      - name: Ensure R2 custom domain uses TLS 1.3
        if: ${{ inputs.custom_domain_config }}
        run: node scripts/configure-r2-custom-domain.js

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: prepare
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Download pre-built artifact if provided
      - name: Download build artifact
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}

      # Build only if no artifact provided
      - name: Install dependencies
        if: ${{ inputs.artifact_name == '' }}
        run: npm install --legacy-peer-deps --silent

      - name: Build with OpenNext
        if: ${{ inputs.artifact_name == '' }}
        run: npm run opennext:build
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_HOSTNAME: ${{ vars.R2_PUBLIC_HOSTNAME }}
          ADMIN_PORTAL_PASSWORD: ${{ secrets.ADMIN_PORTAL_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

      - name: Ensure SSR chunks are present
        if: ${{ inputs.artifact_name == '' }}
        run: |
          mkdir -p .open-next/server/chunks/ssr
          if [ -d .next/server/chunks/ssr ] && compgen -G ".next/server/chunks/ssr/*" > /dev/null; then
            cp -r .next/server/chunks/ssr/* .open-next/server/chunks/ssr/
          fi

      - name: Render Wrangler config
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          R2_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_HOSTNAME: ${{ vars.R2_PUBLIC_HOSTNAME }}
          ADMIN_PORTAL_HOSTS: ${{ vars.ADMIN_PORTAL_HOSTS }}
          ADMIN_PORTAL_PASSWORD: ${{ secrets.ADMIN_PORTAL_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID"
          export CLOUDFLARE_ZONE_ID="$CF_ZONE_ID"
          export CLOUDFLARE_API_TOKEN="$R2_API_TOKEN"
          export R2_ACCOUNT_ID="$CF_ACCOUNT_ID"
          export R2_BUCKET_NAME="$R2_BUCKET"
          
          envsubst < wrangler.toml > wrangler.resolved.toml
          echo "Wrangler config rendered successfully"

      - name: Run D1 migrations
        run: |
          echo "Applying D1 migrations for ${{ inputs.environment }}..."
          if [ "${{ inputs.environment }}" = "production" ]; then
            DB_NAME="inkpup-db"
          else
            DB_NAME="inkpup-db-${{ inputs.environment }}"
          fi
          npx --yes wrangler@4 d1 migrations apply "$DB_NAME" \
            --config wrangler.resolved.toml \
            --env ${{ inputs.environment }} \
            --remote
          echo "D1 migrations complete"

      - name: Deploy to environment
        run: |
          npx --yes wrangler@4 deploy \
            --config wrangler.resolved.toml \
            --env ${{ inputs.environment }}

      - name: Confirm deployment
        run: |
          npx --yes wrangler@4 deployments status \
            --config wrangler.resolved.toml \
            --env ${{ inputs.environment }}
