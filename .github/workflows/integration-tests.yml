name: Integration Tests (Master Gate)

on:
  pull_request:
    branches: [master]

jobs:
  # Build once for all jobs - production build for verification
  build:
    name: Build (Production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --silent

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Build OpenNext bundle
        run: npm run opennext:build

      - name: Ensure SSR chunks are present
        run: |
          mkdir -p .open-next/server/chunks/ssr
          if [ -d .next/server/chunks/ssr ] && compgen -G ".next/server/chunks/ssr/*" > /dev/null; then
            cp -r .next/server/chunks/ssr/* .open-next/server/chunks/ssr/
          fi

      - name: Verify bundle integrity
        run: |
          echo "Checking OpenNext bundle..."
          test -f .open-next/worker.js || (echo "❌ worker.js missing" && exit 1)
          test -d .open-next/assets || (echo "❌ assets directory missing" && exit 1)
          echo "✅ Bundle verified"

      - name: Check bundle size
        run: |
          WORKER_SIZE=$(stat -c%s .open-next/worker.js 2>/dev/null || stat -f%z .open-next/worker.js)
          echo "Worker bundle size: $((WORKER_SIZE / 1024)) KB"
          # Fail if bundle exceeds 25MB (Cloudflare limit)
          if [ "$WORKER_SIZE" -gt 26214400 ]; then
            echo "❌ Bundle too large for Cloudflare Workers (max 25MB)"
            exit 1
          fi
          echo "✅ Bundle size OK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .next
            .open-next
          include-hidden-files: true
          retention-days: 1

  # Unit tests run in parallel (no build needed)
  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/unit-tests.yml

  # E2E tests need the build artifact
  e2e-tests:
    name: E2E Tests
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps --silent

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  # Summary gate
  summary:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [build, unit-tests, e2e-tests]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Build failed"
            exit 1
          fi
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
            echo "❌ E2E tests failed"
            exit 1
          fi
          echo "✅ All checks passed - ready to merge to master"
