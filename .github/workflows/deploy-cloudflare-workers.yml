name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master, dev*]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and deploy directly'
        required: false
        default: false
        type: boolean

jobs:
  # Build once, reuse everywhere
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --silent

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.scss') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build Next.js
        run: npm run build

      - name: Build OpenNext bundle
        run: npm run opennext:build

      - name: Ensure SSR chunks are present
        run: |
          mkdir -p .open-next/server/chunks/ssr
          if [ -d .next/server/chunks/ssr ] && compgen -G ".next/server/chunks/ssr/*" > /dev/null; then
            cp -r .next/server/chunks/ssr/* .open-next/server/chunks/ssr/
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .next
            .open-next
          include-hidden-files: true
          retention-days: 1

  # Unit tests run in parallel (no build needed)
  unit-tests:
    name: Unit Tests
    if: ${{ github.event_name == 'push' || !inputs.skip_tests }}
    uses: ./.github/workflows/unit-tests.yml

  # E2E tests need the build artifact - only run on master
  e2e-tests:
    name: E2E Tests
    if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || !inputs.skip_tests) }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps --silent

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload test traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/**/trace.zip
          if-no-files-found: ignore

  # Deploy uses the build artifact
  deploy:
    name: Deploy
    needs: [build, unit-tests, e2e-tests]
    if: |
      always() && 
      needs.unit-tests.result == 'success' &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped')
    uses: ./.github/workflows/cloudflare-reusable.yml
    with:
      environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'dev' }}
      branch: ${{ github.ref_name }}
      custom_domain_config: ${{ github.ref == 'refs/heads/master' }}
      artifact_name: build-output
    secrets:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      R2_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      ADMIN_PORTAL_PASSWORD: ${{ secrets.ADMIN_PORTAL_PASSWORD }}
      ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
